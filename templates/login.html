{% extends "base.html" %}

{% block title %}管理員登入{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card card-custom p-4 shadow-sm">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
                    <i class="bi bi-shield-lock-fill fs-1"></i>
                </div>
                <h4 class="fw-bold">後台管理系統登入</h4>
                <p class="text-muted small">請輸入管理員帳號密碼以進入系統</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">帳號 (Username)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="請輸入帳號" value="admin" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">密碼 (Password)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="請輸入密碼" value="admin123" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-gradient py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> 立即登入
                    </button>
                </div>

                <div class="alert alert-secondary py-2 small mb-0">
                    <i class="bi bi-info-circle me-1"></i> <strong>預設管理員帳密：</strong><br>
                    帳號：<code>admin</code> / 密碼：<code>admin123</code>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
